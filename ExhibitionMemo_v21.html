<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0f1a">
  <title>10秒記録メモ v21</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #000; color: #f0f0f0;
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }
    #screen-rec { display: flex; flex-direction: column; height: 100dvh; }
    #camera-wrap {
      position: relative; flex: 1; background: #000;
      overflow: hidden; min-height: 0;
    }
    #video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #datetime-overlay {
      position: absolute; top: 10px; left: 10px;
      pointer-events: none; line-height: 1.4;
    }
    #date-line { font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 0 6px #000, 0 1px 3px #000; }
    #time-line { font-size: 18px; font-weight: 700; color: #f5c500; text-shadow: 0 0 8px #000, 0 1px 4px #000; }
    #count-label {
      position: absolute; top: 12px; right: 12px;
      font-size: 12px; color: #fff;
      background: rgba(0,0,0,0.5); padding: 3px 10px; border-radius: 20px;
      pointer-events: none;
    }
    #rec-badge {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px; font-weight: 600; padding: 5px 18px;
      border-radius: 20px; background: #e02020; color: #fff;
      display: none; pointer-events: none;
    }
    #count-down {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -30%);
      font-size: 90px; font-weight: 200; color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.9);
      display: none; pointer-events: none;
    }
    #progress { position: absolute; bottom: 0; left: 0; height: 5px; background: #f5c500; width: 0%; }
    #saved-msg {
      position: absolute; bottom: 10px; left: 50%;
      transform: translateX(-50%);
      font-size: 13px; color: #4caf50; font-weight: 500;
      white-space: nowrap; display: none; pointer-events: none;
      background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 10px;
    }
    #warning-banner {
      display: none; background: #e02020; color: #fff;
      text-align: center; font-size: 13px; font-weight: 600;
      padding: 6px; flex-shrink: 0;
    }
    #error-msg {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px; color: #ff6b6b; text-align: center;
      padding: 12px 20px; background: rgba(0,0,0,0.8);
      border-radius: 10px; display: none;
    }
    #bottom-bar {
      background: #0a0a0a; padding: 10px 20px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-top: 3px solid #f5c500; flex-shrink: 0;
    }
    .side-btn {
      width: 58px; height: 58px; border-radius: 50%;
      border: 2px solid #444; background: #1a1a1a; color: #ccc;
      font-size: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 2px; line-height: 1.2; text-align: center;
    }
    .side-btn:active { opacity: 0.7; }
    #flip-btn { font-size: 20px; }
    #rec-btn {
      width: 80px; height: 80px; border-radius: 50%;
      border: 4px solid #f5c500; background: #1a1a1a;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: transform 0.1s;
    }
    #rec-btn:active { transform: scale(0.91); }
    #rec-inner {
      width: 38px; height: 38px; border-radius: 50%; background: #e02020;
      transition: border-radius 0.2s, width 0.2s, height 0.2s;
    }
    #rec-btn.recording #rec-inner { border-radius: 8px; width: 28px; height: 28px; }
    #rec-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    #sub-bar {
      display: flex; justify-content: center;
      padding: 6px 0 10px; background: #0a0a0a; flex-shrink: 0;
    }
    #list-btn {
      width: auto; height: auto; border-radius: 20px;
      padding: 8px 24px; font-size: 13px;
      border-color: #f5c500; color: #f5c500;
    }
    #screen-list { display: none; flex-direction: column; height: 100dvh; background: #0f0f1a; }
    #list-header {
      padding: 14px 16px; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 3px solid #f5c500; background: #0a0a0a; flex-shrink: 0;
    }
    #list-header h2 { font-size: 15px; font-weight: 600; }
    #back-btn {
      padding: 7px 14px; border-radius: 8px;
      border: 2px solid #f5c500; background: transparent;
      color: #f5c500; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    /* クリップ一覧の窓の高さは、JSでの計測ではなく最初からCSSのcalc()だけで
       「8個ぶん」の固定値として計算する。画面幅（列数）ごとに行数が変わるため
       （2列なら4行、3列なら3行、4列なら2行）、ブレークポイントごとに式を分けている。
       JS計測に頼らないので、端末や読み込みタイミングに左右されず常に安定して固定される。 */
    #clip-grid {
      flex: 1 1 auto; overflow-y: scroll; padding: 10px;
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; min-height: 0; align-content: start;
      max-height: calc(4 * ((100vw - 30px) / 2 * 0.75) + 50px);
      scrollbar-width: auto; scrollbar-color: #f5c500 #1a1a2e;
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    }
    #clip-grid::-webkit-scrollbar { width: 8px; }
    #clip-grid::-webkit-scrollbar-track { background: #1a1a2e; }
    #clip-grid::-webkit-scrollbar-thumb { background: #f5c500; border-radius: 4px; }
    @media (min-width: 420px) {
      #clip-grid {
        grid-template-columns: repeat(3, 1fr);
        max-height: calc(3 * ((100vw - 40px) / 3 * 0.75) + 40px);
      }
    }
    @media (min-width: 640px) {
      #clip-grid {
        grid-template-columns: repeat(4, 1fr);
        max-height: calc(2 * ((100vw - 50px) / 4 * 0.75) + 30px);
      }
    }
    .clip-card {
      position: relative; background: #1a1a2e; border-radius: 10px;
      overflow: hidden; border: 0.5px solid #2a2a3a; cursor: pointer;
    }
    .clip-card video, .clip-card .clip-poster-img {
      width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #000;
      pointer-events: none;
    }
    .clip-card .clip-poster-img { position: absolute; top: 0; left: 0; display: none; }
    .clip-card.unloaded video { visibility: hidden; }
    .clip-card.unloaded .clip-poster-img { display: block; }
    .clip-play-icon {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(0,0,0,0.55); color: #fff; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .clip-badge-time {
      position: absolute; bottom: 4px; left: 5px; right: 5px;
      font-size: 10px; color: #fff; text-shadow: 0 1px 3px #000;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
    }
    .clip-badge-done {
      position: absolute; top: 5px; right: 5px;
      font-size: 10px; background: rgba(76,175,80,0.9); color: #fff;
      border-radius: 10px; padding: 1px 7px; pointer-events: none;
    }
    #scroll-sentinel { height: 1px; grid-column: 1 / -1; }
    #load-more-msg {
      grid-column: 1 / -1; text-align: center; color: #555; font-size: 12px; padding: 10px 0;
    }
    #empty-msg { text-align: center; color: #555; font-size: 14px; margin-top: 40px; grid-column: 1 / -1; }
    #list-footer {
      padding: 10px 14px 18px; background: #0a0a0a;
      border-top: 1px solid #222; display: flex; gap: 8px; flex-shrink: 0;
    }
    #dl-all-btn {
      flex: 1; padding: 11px; border-radius: 10px; border: none;
      background: #f5c500; color: #000; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    #dl-all-btn:disabled { opacity: 0.4; cursor: default; }
    #clear-btn {
      padding: 11px 14px; border-radius: 10px;
      border: 2px solid #e02020; background: transparent;
      color: #e02020; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #player-overlay {
      display: none; position: fixed; inset: 0; z-index: 150;
      background: #000; flex-direction: column;
    }
    #player-overlay.open { display: flex; }
    #player-video-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; min-height: 0;
    }
    #player-video { max-width: 100%; max-height: 100%; display: block; }
    #player-telop {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7); color: #f5c500;
      font-size: 13px; font-weight: 600; padding: 8px 14px; text-align: center;
    }
    #player-bar {
      flex-shrink: 0; padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
      background: #0a0a0a; display: flex; gap: 8px;
      border-top: 3px solid #f5c500;
    }
    #player-close-btn {
      padding: 11px 18px; border-radius: 10px; border: 2px solid #f5c500;
      background: transparent; color: #f5c500; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #player-save-btn {
      flex: 1; padding: 11px; border-radius: 10px; border: none;
      background: #f5c500; color: #000; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    #player-save-btn.done { background: #333; color: #666; cursor: default; }
    .dialog {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.88); z-index: 200;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; padding: 24px;
    }
    .dialog.visible { display: flex; }
    .dialog p { font-size: 15px; color: #fff; text-align: center; line-height: 1.6; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .dialog button { padding: 11px 20px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: #333; color: #fff; }
    .btn-danger { background: #e02020; color: #fff; }
    .btn-ok { background: #f5c500; color: #000; }
  </style>
</head>
<body>

  <div id="screen-rec">
    <div id="warning-banner">⚠️ クリップが増えています！一覧から保存してください</div>
    <div id="camera-wrap">
      <video id="video" autoplay muted playsinline></video>
      <div id="datetime-overlay">
        <div id="date-line"></div>
        <div id="time-line"></div>
      </div>
      <span id="count-label">0 クリップ</span>
      <div id="rec-badge">● REC</div>
      <div id="count-down">10</div>
      <div id="progress"></div>
      <div id="saved-msg">✅ 保存しました</div>
      <div id="error-msg">カメラの許可が必要です。<br>ブラウザの設定でカメラをONにしてください。</div>
    </div>
    <div id="bottom-bar">
      <button class="side-btn" id="exit-btn">⏹<br>終了</button>
      <button id="rec-btn" disabled><div id="rec-inner"></div></button>
      <button class="side-btn" id="flip-btn">🔄</button>
    </div>
    <div id="sub-bar">
      <button class="side-btn" id="list-btn">📋 クリップ一覧</button>
    </div>
  </div>

  <div id="screen-list">
    <div id="list-header">
      <h2>撮影済みクリップ</h2>
      <button id="back-btn">← 撮影に戻る</button>
    </div>
    <div id="clip-grid">
      <div id="empty-msg">まだクリップがありません</div>
    </div>
    <div id="list-footer">
      <button id="dl-all-btn">📦 未保存をまとめて保存(ZIP)</button>
      <button id="clear-btn">🗑 全削除</button>
    </div>
  </div>

  <div id="player-overlay">
    <div id="player-video-wrap">
      <video id="player-video" controls playsinline></video>
      <div id="player-telop"></div>
    </div>
    <div id="player-bar">
      <button id="player-close-btn">← 一覧に戻る</button>
      <button id="player-save-btn">端末に保存</button>
    </div>
  </div>

  <div id="exit-dialog" class="dialog">
    <p id="exit-msg">終了しますか？</p>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeDialog('exit-dialog')">戻る</button>
      <button class="btn-ok" onclick="doDownloadAndExit()">未保存を保存して終了</button>
      <button class="btn-danger" onclick="doExit()">そのまま終了</button>
    </div>
  </div>

  <div id="clear-dialog" class="dialog">
    <p>全クリップを削除しますか？<br><span style="color:#f5c500;font-size:13px;">未保存のものも消えます</span></p>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeDialog('clear-dialog')">キャンセル</button>
      <button class="btn-danger" onclick="doClear()">削除する</button>
    </div>
  </div>

  <script>
    // これ以降のバージョンアップでは、このDB名を変更しない。
    // （以前はバージョンごとにDB名を変えていたため、アップデートのたびに
    //   録画データが引き継がれず、一覧が毎回空になってしまっていた）
    const DB_NAME = 'ExhibitionMemoDB';
    const OLD_DB_NAME = 'ExhibitionMemoDB_v20'; // 直前バージョンからの一度きりの引き継ぎ用
    const STORE = 'clips';
    let db, stream, mediaRecorder, chunks = [], clipCount = 0, timerInterval;
    let facingMode = 'environment';

    const videoEl    = document.getElementById('video');
    const recBtn     = document.getElementById('rec-btn');
    const recBadge   = document.getElementById('rec-badge');
    const countDown  = document.getElementById('count-down');
    const progressEl = document.getElementById('progress');
    const savedMsg   = document.getElementById('saved-msg');
    const countLabel = document.getElementById('count-label');
    const warningBanner = document.getElementById('warning-banner');
    const errorMsg   = document.getElementById('error-msg');
    const dateLine   = document.getElementById('date-line');
    const timeLine   = document.getElementById('time-line');

    const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    function pad(n) { return String(n).padStart(2,'0'); }
    function updateDatetime() {
      const d = new Date();
      dateLine.textContent = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${DAYS[d.getDay()]}`;
      timeLine.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    setInterval(updateDatetime, 1000);
    updateDatetime();

    function getTimestamp() {
      const d = new Date();
      return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    }
    function randStr() { return Math.random().toString(36).slice(2,6); }
    function getMimeType() {
      const types = ['video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm;codecs=vp8','video/webm','video/mp4;codecs=avc1','video/mp4'];
      for (const t of types) { if (MediaRecorder.isTypeSupported(t)) return t; }
      return '';
    }
    function getExt(mimeType) { return mimeType.includes('mp4') ? 'mp4' : 'webm'; }
    function openDialog(id) { document.getElementById(id).classList.add('visible'); }
    function closeDialog(id) { document.getElementById(id).classList.remove('visible'); }

    // IndexedDB
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { autoIncrement: true });
        req.onsuccess = e => { db = e.target.result; resolve(); };
        req.onerror = reject;
      });
    }
    function saveToDb(blob, filename) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        const req = tx.objectStore(STORE).add({ blob, filename, downloaded: false });
        req.onsuccess = e => resolve(e.target.result); // 生成されたキーを返す
        req.onerror = reject;
      });
    }
    function getAllClips() {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE, 'readonly');
        tx.objectStore(STORE).getAll().onsuccess = e => resolve(e.target.result);
      });
    }
    function getAllKeys() {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE, 'readonly');
        tx.objectStore(STORE).getAllKeys().onsuccess = e => resolve(e.target.result);
      });
    }
    // ダウンロード済みフラグをセット
    function markDownloaded(key) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE, 'readwrite');
        const store = tx.objectStore(STORE);
        const req = store.get(key);
        req.onsuccess = e => {
          const data = e.target.result;
          data.downloaded = true;
          store.put(data, key).onsuccess = resolve;
        };
      });
    }
    // 直前バージョン（v20）のDBにクリップが残っていて、新しい共通DBがまだ空の場合だけ、
    // 一度きりの引き継ぎを行う。以降のバージョンはDB名を変えないので、この処理は不要になる。
    async function migrateOldDbIfNeeded() {
      try {
        if (!indexedDB.databases) return; // 未対応ブラウザでは何もしない
        const dbs = await indexedDB.databases();
        if (!dbs.some(d => d.name === OLD_DB_NAME)) return;

        const alreadyHasData = (await getAllClips()).length > 0;
        if (alreadyHasData) return;

        const oldDb = await new Promise((resolve, reject) => {
          const req = indexedDB.open(OLD_DB_NAME);
          req.onsuccess = e => resolve(e.target.result);
          req.onerror = () => reject(req.error);
        });
        if (!oldDb.objectStoreNames.contains(STORE)) { oldDb.close(); return; }
        const oldClips = await new Promise((resolve) => {
          const tx = oldDb.transaction(STORE, 'readonly');
          tx.objectStore(STORE).getAll().onsuccess = e => resolve(e.target.result);
        });
        oldDb.close();
        for (const clip of oldClips) {
          const key = await saveToDb(clip.blob, clip.filename);
          if (clip.downloaded) await markDownloaded(key);
        }
      } catch (e) {
        // 引き継ぎに失敗しても起動は続行する（過去データが見えないだけで、致命的ではない）
      }
    }
    function clearDB() {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).clear().onsuccess = resolve;
      });
    }

    async function initCamera() {
      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        videoEl.srcObject = stream;
        videoEl.play().catch(()=>{});
        recBtn.disabled = false;
        errorMsg.style.display = 'none';
      } catch(e) {
        errorMsg.style.display = 'block';
      }
    }

    document.getElementById('flip-btn').addEventListener('click', async () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      await initCamera();
    });

    function startRec() {
      chunks = [];
      const mimeType = getMimeType();
      try {
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
      } catch(e) {
        mediaRecorder = new MediaRecorder(stream);
      }
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = clipDone;
      mediaRecorder.start(100);

      recBtn.classList.add('recording');
      recBtn.disabled = true;
      recBadge.style.display = 'block';
      countDown.style.display = 'block';
      savedMsg.style.display = 'none';

      progressEl.style.transition = 'none';
      progressEl.style.width = '0%';
      setTimeout(() => {
        progressEl.style.transition = 'width 10s linear';
        progressEl.style.width = '100%';
      }, 50);

      let secs = 10;
      countDown.textContent = secs;
      timerInterval = setInterval(() => {
        secs--;
        countDown.textContent = secs;
        if (secs <= 0) { clearInterval(timerInterval); mediaRecorder.stop(); }
      }, 1000);
    }

    async function clipDone() {
      clipCount++;
      const mimeType = chunks[0]?.type || 'video/webm';
      const ext = getExt(mimeType);
      const filename = `記録_${getTimestamp()}_${clipCount}_${randStr()}.${ext}`;
      const blob = new Blob(chunks, { type: mimeType });
      const key = await saveToDb(blob, filename);

      // 撮影ごとに自動で端末のダウンロードフォルダにもバックアップ保存する。
      // ブラウザが「複数ファイルのダウンロードを許可しますか」を聞いてくるのは
      // 最初の数回だけで、一度許可すればそのサイトでは以降ずっと自動で続く。
      autoDownloadToDevice(blob, filename);
      await markDownloaded(key);

      countLabel.textContent = `${clipCount} クリップ`;
      savedMsg.textContent = `✅ ${clipCount}本目 保存完了（端末にも保存）`;
      savedMsg.style.display = 'block';
      if (clipCount >= 25) warningBanner.style.display = 'block';

      setTimeout(() => {
        if (stream && stream.active) { videoEl.srcObject = stream; videoEl.play().catch(()=>{}); }
        recBtn.classList.remove('recording');
        recBtn.disabled = false;
        recBadge.style.display = 'none';
        countDown.style.display = 'none';
        progressEl.style.transition = 'none';
        progressEl.style.width = '0%';
        setTimeout(() => { savedMsg.style.display = 'none'; }, 2000);
      }, 400);
    }

    // --- 一覧（8個ずつ・最新順・無限スクロール）＋ 全画面プレーヤー ---
    const PAGE_SIZE = 8;
    let clipItems = [];   // { clip, key, url, poster } 最新順
    let loadedCount = 0;
    let gridObserver = null;
    let unloadObserver = null;
    let currentPlayerItem = null;

    function nameForDisplay(filename) {
      return filename
        .replace('記録_', '')
        .replace(/\..*$/, '')
        .replace(/_[a-z0-9]{4}$/, '')
        .replace(/_(\d+)$/, ' #$1')
        .replace(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/, '$1-$2-$3 $4:$5:$6');
    }

    async function openList() {
      document.getElementById('screen-rec').style.display = 'none';
      document.getElementById('screen-list').style.display = 'flex';
      await renderList();
    }

    // 最新順のクリップ一覧を読み直し、先頭8個を表示してスクロール監視をセット
    async function renderList() {
      const clips = await getAllClips();
      const keys  = await getAllKeys();
      clipItems = clips.map((clip, i) => ({ clip, key: keys[i] })).reverse(); // 最新が先頭
      loadedCount = 0;

      const gridEl = document.getElementById('clip-grid');
      gridEl.innerHTML = '';

      if (clipItems.length === 0) {
        gridEl.innerHTML = '<div id="empty-msg">まだクリップがありません</div>';
        document.getElementById('dl-all-btn').disabled = true;
        return;
      }
      document.getElementById('dl-all-btn').disabled = false;

      const sentinel = document.createElement('div');
      sentinel.id = 'scroll-sentinel';
      gridEl.appendChild(sentinel);

      // 画面外（上下とも）に大きく外れたカードは、サムネイル用のblob URLを解放して
      // メモリを一定に保つ。再びこの範囲に近づいたら自動で読み直す。
      if (unloadObserver) unloadObserver.disconnect();
      unloadObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const item = entry.target._item;
          if (!item) return;
          if (entry.isIntersecting) {
            ensureLoaded(item, entry.target);
          } else {
            unloadCard(item, entry.target);
          }
        });
      }, { root: gridEl, rootMargin: '600px 0px' });

      loadMoreCards();

      if (gridObserver) gridObserver.disconnect();
      gridObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          loadMoreCards();
          // センチネルが読み込み後も画面内に残っている場合、IntersectionObserverは
          // 状態変化がないと再発火しないため、一度unobserve→observaで強制的に再判定させる
          const s = document.getElementById('scroll-sentinel');
          if (s) { gridObserver.unobserve(s); gridObserver.observe(s); }
        }
      }, { root: gridEl, rootMargin: '200px' });
      gridObserver.observe(sentinel);
    }

    // 次の8個分のカードをグリッドに追加（スクロール監視用センチネルの直前に挿入）
    function loadMoreCards() {
      if (loadedCount >= clipItems.length) return;
      const gridEl = document.getElementById('clip-grid');
      const sentinel = document.getElementById('scroll-sentinel');
      const nextItems = clipItems.slice(loadedCount, loadedCount + PAGE_SIZE);
      nextItems.forEach(item => {
        if (!item.url) item.url = URL.createObjectURL(item.clip.blob);
        const card = buildClipCard(item);
        gridEl.insertBefore(card, sentinel);
      });
      loadedCount += nextItems.length;

      let moreMsg = document.getElementById('load-more-msg');
      if (loadedCount >= clipItems.length) {
        if (!moreMsg) {
          moreMsg = document.createElement('div');
          moreMsg.id = 'load-more-msg';
          gridEl.insertBefore(moreMsg, sentinel);
        }
        moreMsg.textContent = `全 ${clipItems.length} 件`;
      } else if (moreMsg) {
        moreMsg.remove();
      }
    }

    function buildClipCard(item) {
      const { clip } = item;
      const isDownloaded = clip.downloaded === true;
      const card = document.createElement('div');
      card.className = `clip-card${isDownloaded ? ' downloaded' : ''}`;
      card.innerHTML = `
        <video ${item.url ? `src="${item.url}"` : ''} muted playsinline preload="metadata"></video>
        <img class="clip-poster-img" alt="">
        <div class="clip-play-icon">▶</div>
        <div class="clip-badge-time">${nameForDisplay(clip.filename)}</div>
        ${isDownloaded ? '<div class="clip-badge-done">✅ 済</div>' : ''}
      `;
      card.addEventListener('click', () => openPlayer(item, card));
      card._item = item;
      if (unloadObserver) unloadObserver.observe(card);
      return card;
    }

    // サムネイル1コマぶんの静止画をキャプチャして保持しておく（<video>本体のposter属性は
    // 触らない。再生前のvideo要素にposterをセットすると、その後実データが揃っても
    // ブラウザがposter画像を表示し続けてしまう端末があるため、別のimg要素で代用する）
    function capturePoster(item, video) {
      if (item.poster) return;
      try {
        const w = 160;
        const ratio = (video.videoWidth && video.videoHeight) ? (video.videoHeight / video.videoWidth) : 0.75;
        const h = Math.round(w * ratio) || 120;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(video, 0, 0, w, h);
        item.poster = canvas.toDataURL('image/jpeg', 0.6);
      } catch (e) {
        // まだフレームが描画できる状態でない等。次の機会に再試行する
      }
    }

    // カードが表示範囲（上下600px以内）に入ってきたら、blob URLを作り直して動画を再セットする
    function ensureLoaded(item, cardEl) {
      if (!item.url) item.url = URL.createObjectURL(item.clip.blob);
      const video = cardEl.querySelector('video');
      if (video && video.getAttribute('src') !== item.url) {
        video.src = item.url;
      }
      cardEl.classList.remove('unloaded');
    }

    // カードが表示範囲から大きく外れたら、blob URLを解放してメモリを空ける
    // （録画データそのものはIndexedDBに残ったままなので、消えることはない。
    //   直前に撮れた静止画をimgで代わりに表示しておく）
    function unloadCard(item, cardEl) {
      if (!item.url) return;
      const video = cardEl.querySelector('video');
      if (video) {
        if (!item.poster) capturePoster(item, video); // 解放前の最後のチャンスとして静止画を確保
        if (!item.poster) return; // 静止画がまだ用意できていない場合は、今回は解放を見送る
        const img = cardEl.querySelector('.clip-poster-img');
        if (img) img.src = item.poster;
        cardEl.classList.add('unloaded');
        video.removeAttribute('src');
        video.load();
      }
      URL.revokeObjectURL(item.url);
      item.url = null;
    }

    // 全画面プレーヤーで再生。終了したら一覧（8個表示）に自動で戻る
    function openPlayer(item, cardEl) {
      currentPlayerItem = item;
      if (!item.url) item.url = URL.createObjectURL(item.clip.blob); // 念のため（解放済みだった場合の保険）
      const overlay = document.getElementById('player-overlay');
      const video = document.getElementById('player-video');
      const telop = document.getElementById('player-telop');
      const saveBtn = document.getElementById('player-save-btn');

      video.src = item.url;
      telop.textContent = nameForDisplay(item.clip.filename);
      saveBtn.textContent = item.clip.downloaded ? '✅ 保存済み' : '端末に保存';
      saveBtn.classList.toggle('done', !!item.clip.downloaded);
      overlay.dataset.cardRef = '';
      overlay._cardEl = cardEl;

      overlay.classList.add('open');
      video.currentTime = 0;
      video.play().catch(()=>{});

      video.onended = closePlayer;
    }

    function closePlayer() {
      const overlay = document.getElementById('player-overlay');
      const video = document.getElementById('player-video');
      video.pause();
      video.onended = null;
      overlay.classList.remove('open');
      currentPlayerItem = null;
    }

    document.getElementById('player-close-btn').addEventListener('click', closePlayer);
    document.getElementById('player-save-btn').addEventListener('click', async () => {
      if (!currentPlayerItem || currentPlayerItem.clip.downloaded) return;
      await downloadSingle(currentPlayerItem);
      const saveBtn = document.getElementById('player-save-btn');
      saveBtn.textContent = '✅ 保存済み';
      saveBtn.classList.add('done');
    });

    // 撮影直後に自動で端末へダウンロードする（IndexedDBへの保存とは別に、
    // 端末のダウンロードフォルダにもバックアップを残すための処理）
    function autoDownloadToDevice(blob, filename) {
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        // 自動保存に失敗しても、記録データ自体はIndexedDBに残っているので
        // クリップ一覧から個別に「端末に保存」できる
      }
    }

    // 1本だけ端末に保存（個別・全画面プレーヤーからの保存用）
    async function downloadSingle(item) {
      const url = URL.createObjectURL(item.clip.blob);
      const a = document.createElement('a');
      a.href = url; a.download = item.clip.filename;
      a.style.display = 'none';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      await markDownloaded(item.key);
      item.clip.downloaded = true;
      if (item._cardEl) item._cardEl.classList.add('downloaded');
    }

    // 未保存クリップをまとめて1つのZIPにして、ダウンロードは1回だけにする
    // （個別ダウンロードを繰り返すと、ブラウザが「複数ファイルのダウンロードを許可しますか」を
    //  何度も聞いてくるため、ZIP1本にまとめて確認を1回で済むようにしている）
    async function dlAll() {
      const clips = await getAllClips();
      const keys  = await getAllKeys();
      const targets = clips
        .map((clip, i) => ({ clip, key: keys[i] }))
        .filter(t => !t.clip.downloaded);

      if (targets.length === 0) { alert('未保存のクリップはありません'); return; }

      const btn = document.getElementById('dl-all-btn');
      btn.disabled = true;
      btn.textContent = 'ZIP作成中…';

      try {
        if (typeof JSZip !== 'undefined') {
          const zip = new JSZip();
          targets.forEach(t => zip.file(t.clip.filename, t.clip.blob));
          const zipBlob = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(zipBlob);
          const a = document.createElement('a');
          a.href = url; a.download = `記録_まとめ_${getTimestamp()}.zip`;
          a.style.display = 'none';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          for (const t of targets) await markDownloaded(t.key);
        } else {
          // ZIPライブラリが読み込めなかった場合は、従来通り1本ずつダウンロード
          for (const t of targets) {
            await downloadSingle(t);
            await new Promise(r => setTimeout(r, 800));
          }
        }
      } finally {
        btn.textContent = '📦 未保存をまとめて保存(ZIP)';
        await renderList();
      }
    }

    function backToRec() {
      closePlayer();
      document.getElementById('screen-list').style.display = 'none';
      document.getElementById('screen-rec').style.display = 'flex';
      if (stream && stream.active) { videoEl.srcObject = stream; videoEl.play().catch(()=>{}); }
    }

    async function doClear() {
      await clearDB();
      clipCount = 0;
      countLabel.textContent = '0 クリップ';
      warningBanner.style.display = 'none';
      closeDialog('clear-dialog');
      await renderList();
    }

    async function doDownloadAndExit() {
      closeDialog('exit-dialog');
      await dlAll();
      doExit();
    }

    function doExit() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      closeDialog('exit-dialog');
      document.body.innerHTML = `
        <div style="color:#fff;text-align:center;padding-top:35vh;font-size:18px;background:#000;height:100vh;">
          <div style="font-size:40px;margin-bottom:16px;">✅</div>
          終了しました。<br>
          <span style="font-size:13px;color:#666;margin-top:8px;display:block;">このタブを閉じてください</span>
        </div>`;
    }

    recBtn.addEventListener('click', startRec);
    document.getElementById('list-btn').addEventListener('click', openList);
    document.getElementById('back-btn').addEventListener('click', backToRec);
    document.getElementById('exit-btn').addEventListener('click', async () => {
      const clips = await getAllClips();
      const undownloaded = clips.filter(c => !c.downloaded).length;
      document.getElementById('exit-msg').textContent =
        undownloaded > 0
          ? `未保存のクリップが${undownloaded}本あります。\n保存してから終了しますか？`
          : '終了しますか？';
      openDialog('exit-dialog');
    });
    document.getElementById('dl-all-btn').addEventListener('click', dlAll);
    document.getElementById('clear-btn').addEventListener('click', () => openDialog('clear-dialog'));

    (async () => {
      await initDB();
      await migrateOldDbIfNeeded();
      const clips = await getAllClips();
      clipCount = clips.length;
      if (clipCount > 0) countLabel.textContent = `${clipCount} クリップ`;
      await initCamera();
    })();
  </script>
</body>
</html>
